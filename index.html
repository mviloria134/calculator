<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script type="module" src="calculator.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <input type="text" name="calc-display" id="calc-display">
        <div id="buttons">
            <ul id="numbers">
                <li><button>1</button></li>
                <li><button>2</button></li>
                <li><button>3</button></li>
                <li><button>4</button></li>
                <li><button>5</button></li>
                <li><button>6</button></li>
                <li><button>7</button></li>
                <li><button>8</button></li>
                <li><button>9</button></li>
                <li><button>+/-</button></li>
                <li><button>0</button></li>
                <li><button>.</button></li>
            </ul>
            <ul id="operators">
                <li><button>C</button></li>
                <li><button>+</button></li>
                <li><button>=</button></li>
                <li><button>*</button></li>
                <li><button>/</button></li>
                <li><button>=</button></li>
            </ul>
        </div>
    </div>
</body>
</html>
